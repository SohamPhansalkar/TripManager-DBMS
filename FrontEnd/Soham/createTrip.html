<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home — Trip Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header id="navbar-slot"></header>

    <main class="container py-5 mt-5">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div
            class="create-trip-container bg-white p-4 p-md-5 rounded-4 shadow"
          >
            <h2 class="section-title mb-4">Plan Your New Journey</h2>

            <form id="createTripForm">
              <!-- Basic Trip Details -->
              <section class="mb-5">
                <h4 class="mb-3 text-primary">
                  <i class="bi bi-geo-alt"></i> Trip Overview
                </h4>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="destination" class="form-label"
                      >Destination</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="destination"
                      placeholder="e.g. Goa, India"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="budget" class="form-label">Budget (INR)</label>
                    <input
                      type="number"
                      class="form-control"
                      id="budget"
                      placeholder="e.g. 20000"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="startDate" class="form-label">Start Date</label>
                    <input
                      type="date"
                      class="form-control"
                      id="startDate"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="endDate" class="form-label">End Date</label>
                    <input
                      type="date"
                      class="form-control"
                      id="endDate"
                      required
                    />
                  </div>
                  <div class="col-12 mt-3 text-end">
                    <button
                      type="button"
                      id="saveTripBtn"
                      class="btn btn-success"
                    >
                      Save Trip Overview
                    </button>
                  </div>
                </div>
              </section>

              <!-- Days & Events Section -->
              <section class="mb-4">
                <div
                  class="d-flex justify-content-between align-items-center mb-3"
                >
                  <h4 class="text-primary mb-0">
                    <i class="bi bi-calendar3"></i> Itinerary
                  </h4>
                  <button
                    type="button"
                    id="addDayBtn"
                    class="btn btn-outline-primary btn-sm"
                  >
                    + Add Day
                  </button>
                </div>

                <div id="daysContainer">
                  <!-- Day Template (Dynamic) -->
                  <div
                    class="day-block border rounded-3 p-3 mb-4 bg-light shadow-sm"
                    data-day-index="0"
                  >
                    <div
                      class="d-flex justify-content-between align-items-center mb-3"
                    >
                      <h5 class="mb-0">Day 1</h5>
                      <div class="d-flex gap-2">
                        <input
                          type="date"
                          class="form-control form-control-sm day-date"
                          style="max-width: 150px"
                          required
                        />
                        <button
                          type="button"
                          class="btn btn-sm btn-outline-danger remove-day-btn"
                        >
                          Remove
                        </button>
                      </div>
                    </div>

                    <div class="events-list ms-md-4 mb-2">
                      <!-- Event Template (Dynamic) -->
                      <div
                        class="event-item bg-white border rounded-3 p-3 mb-2 position-relative shadow-xs"
                        data-event-index="0"
                      >
                        <div class="row g-2">
                          <div class="col-md-3">
                            <label class="form-label small">Time</label>
                            <input
                              type="time"
                              class="form-control form-control-sm event-time"
                              required
                            />
                          </div>
                          <div class="col-md-3">
                            <label class="form-label small">Type</label>
                            <select
                              class="form-select form-select-sm event-type"
                              required
                            >
                              <option value="Transport">Transport</option>
                              <option value="Accommodation">
                                Accommodation
                              </option>
                              <option value="Place">Tourist Destination</option>
                              <option value="Food">Food Stop</option>
                              <option value="Other">Other</option>
                            </select>
                          </div>
                          <div class="col-md-6">
                            <label class="form-label small">Description</label>
                            <div class="input-group input-group-sm">
                              <input
                                type="text"
                                class="form-control event-desc"
                                placeholder="Details..."
                                required
                              />
                              <button
                                class="btn btn-outline-danger remove-event-btn"
                                type="button"
                              >
                                ×
                              </button>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>

                    <button
                      type="button"
                      class="btn btn-link btn-sm text-decoration-none add-event-btn"
                    >
                      + Add Event
                    </button>
                  </div>
                </div>
              </section>

              <div class="text-center mt-5">
                <a href="home.html"
                  ><button
                    type="submit"
                    class="btn btn-primary px-5 py-2 shadow"
                  >
                    Create Trip
                  </button></a
                >
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer id="footer-slot"></footer>

    <script src="api_calls.js"></script>
    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
