<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign Up — Trip Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header id="navbar-slot"></header>

    <main class="container py-5 mt-5">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="view-trip-container bg-white p-4 p-md-5 rounded-4 shadow">
            <h2 class="section-title mb-4" id="viewDestination">
              Loading Trip...
            </h2>

            <!-- Basic Trip Details -->
            <section class="mb-5">
              <h4 class="mb-3 text-primary">
                <i class="bi bi-geo-alt"></i> Trip Overview
              </h4>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label text-muted small">Destination</label>
                  <p class="h5" id="dispDestination">-</p>
                </div>
                <div class="col-md-6">
                  <label class="form-label text-muted small"
                    >Budget (INR)</label
                  >
                  <p class="h5" id="dispBudget">-</p>
                </div>
                <div class="col-md-6">
                  <label class="form-label text-muted small">Start Date</label>
                  <p class="h5" id="dispStartDate">-</p>
                </div>
                <div class="col-md-6">
                  <label class="form-label text-muted small">End Date</label>
                  <p class="h5" id="dispEndDate">-</p>
                </div>
              </div>
            </section>

            <!-- Days & Events Section -->
            <section class="mb-4">
              <h4 class="text-primary mb-4">
                <i class="bi bi-calendar3"></i> Itinerary
              </h4>
              <div id="viewDaysContainer">
                <!-- Day blocks will be injected here -->
              </div>
            </section>

            <div class="text-center mt-5">
              <a href="home.html" class="btn btn-primary px-5 py-2 shadow">
                Back to Dashboard
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer id="footer-slot"></footer>

    <script src="api_calls.js"></script>
    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
